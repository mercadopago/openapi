openapi: 3.1.0
info:
  title: MercadoPago API
  description: The MercadoPago REST API. Please see https://www.mercadopago.com/developers for more details.
  termsOfService: https://www.mercadopago.com/developers/es/docs/resources/legal/terms-and-conditions
  contact:
    name: MercadoPago Developer Experience
    url: https://www.mercadopago.com/developers
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: 1.0.0
servers:
- url: https://api.mercadopago.com
  description: Production
security:
- bearerAuth: []
tags:
- name: OAuth
  description: Authorization flows for marketplace on-behalf-of and Wallet Connect
  x-mp-sites: &id001
  - MLA
  - MLB
  - MLM
  - MLC
  - MCO
  - MPE
  - MLU
- name: Preferences
  description: Checkout Pro — redirect-based hosted checkout via Preferences
  x-mp-sites: *id001
- name: Payments
  description: Create and manage payment transactions
  x-mp-sites: *id001
- name: Orders
  description: Checkout API via Orders — recommended for new custom checkout integrations
  x-mp-sites: *id001
- name: Merchant Orders
  description: Order containers that group payments for a single purchase
  x-mp-sites: *id001
- name: Customers
  description: Customer profiles and stored payment methods
  x-mp-sites: *id001
- name: Cards
  description: Saved cards and card tokenization
  x-mp-sites: *id001
- name: Addresses
  description: Customer shipping and billing addresses
  x-mp-sites: *id001
- name: Payment Methods
  description: Available payment methods and installment plans per country
  x-mp-sites: *id001
- name: Identification Types
  description: Country-specific identity document type catalog
  x-mp-sites: *id001
- name: Cancellations & Refunds
  description: Cancel payments and create full or partial refunds
  x-mp-sites: *id001
- name: Chargebacks
  description: Chargeback dispute management
  x-mp-sites: *id001
- name: Subscriptions
  description: Recurring payment subscriptions
  x-mp-sites: *id001
- name: Plans
  description: Subscription billing plans
  x-mp-sites: *id001
- name: Invoices
  description: Subscription billing invoices
  x-mp-sites: *id001
- name: Wallet Connect
  description: OAuth-based wallet agreement flows for Wallet Connect
  x-mp-sites:
  - MLA
  - MLB
  - MLM
- name: Stores
  description: Physical store locations
  x-mp-sites: *id001
- name: POS
  description: Point of sale device management
  x-mp-sites: *id001
- name: Terminals
  description: Point hardware terminal management and print actions
  x-mp-sites:
  - MLA
  - MLB
  - MLC
  - MLM
- name: Point Deprecated
  description: Deprecated Point integration APIs — use Terminals and Point Orders instead
  x-mp-sites:
  - MLA
  - MLB
  - MLM
- name: QR Orders
  description: In-store payment orders associated with QR codes
  x-mp-sites:
  - MLA
  - MLB
  - MLC
  - MCO
  - MPE
  - MLU
- name: QR Integrator
  description: Integrator configuration for QR in-store
  x-mp-sites: *id001
- name: QR Deprecated
  description: Deprecated in-store QR order endpoints (V1, V2, Dynamic QR)
  x-mp-sites: *id001
- name: Claims
  description: Post-sale claim details and search
  x-mp-sites: *id001
- name: Claim Messages
  description: Messages and file attachments within a claim
  x-mp-sites: *id001
- name: Claim Resolutions
  description: Mediation requests and expected resolutions
  x-mp-sites: *id001
- name: Claim Shipping
  description: Upload shipping evidence to support a claim
  x-mp-sites: *id001
- name: Releases Report
  description: Generate and schedule releases (settlement) reports
  x-mp-sites: *id001
- name: Settlements Report
  description: Generate and schedule all-transactions reports
  x-mp-sites: *id001
- name: Payouts
  description: Bank transfer and Pix payouts
  x-mp-sites:
  - MLA
  - MLB
  - MLM
  - MLC
paths:
  /v1/payment_methods:
    get:
      operationId: listPaymentMethods
      summary: List available payment methods
      description: Returns all payment methods available for the credential's site_id. Use this to build payment method selectors
        and validate method availability before attempting a payment.
      tags:
      - Payment Methods
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Payment methods list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    payment_type_id:
                      type: string
                    status:
                      type: string
                      enum:
                      - active
                      - deactivated
                    secure_thumbnail:
                      type: string
                      format: uri
                    thumbnail:
                      type: string
                      format: uri
                    deferred_capture:
                      type: string
                      enum:
                      - supported
                      - unsupported
                      - does_not_apply
                    settings:
                      type: object
                      description: Card settings (bin ranges, security codes, card length).
                    additional_info_needed:
                      type: array
                      items:
                        type: string
                      description: Additional fields required at checkout.
                    min_allowed_amount:
                      type: number
                      format: float
                    max_allowed_amount:
                      type: number
                      format: float
                    accreditation_time:
                      type: integer
                    financial_institutions:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                          description:
                            type: string
                    processing_modes:
                      type: array
                      items:
                        type: string
                        enum:
                        - aggregator
                        - gateway
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      description: create payment method configuration
      parameters: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethodConfigurationOutput'
        '400':
          description: Bad Request
          content:
            application/json:
              schema: {}
        '404':
          description: Not Found
          content:
            application/json:
              schema: {}
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema: {}
      summary: Create Payment Method Configuration
      tags:
        - Payment Method Configuration
      requestBody:
        required: true
        description: Payment Method Configuration
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentMethodConfigurationInputCreate'
  /v1/payment_methods/installments:
    get:
      operationId: getInstallments
      summary: Get installment options
      description: Returns available installment plans for a given card BIN, amount, and site. Use this to populate installment
        selectors in your checkout.
      tags:
      - Payment Methods
      security:
      - bearerAuth: []
      parameters:
      - name: payment_method_id
        in: query
        required: true
        schema:
          type: string
        example: visa
      - name: amount
        in: query
        required: true
        schema:
          type: number
          format: float
        example: 1000.0
      - name: issuer_id
        in: query
        schema:
          type: string
      - name: bin
        in: query
        schema:
          type: string
        description: First 6 digits of the card (BIN) for more accurate installment pricing
        example: '411111'
      responses:
        '200':
          description: Installment options
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    payment_method_id:
                      type: string
                    payment_type_id:
                      type: string
                    issuer:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                    payer_costs:
                      type: array
                      items:
                        type: object
                        properties:
                          installments:
                            type: integer
                          installment_rate:
                            type: number
                            format: float
                          discount_rate:
                            type: number
                            format: float
                          reimbursement_rate:
                            type: number
                            format: float
                          labels:
                            type: array
                            items:
                              type: string
                          total_amount:
                            type: number
                            format: float
                          installment_amount:
                            type: number
                            format: float
    post:
      description: create or update
      parameters: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Installment'
        '400':
          description: Bad Request
          content:
            application/json:
              schema: {}
        '404':
          description: Not Found
          content:
            application/json:
              schema: {}
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema: {}
      summary: Create or Update Installment
      tags:
        - Installment
      requestBody:
        required: true
        description: Installment
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Installment'
