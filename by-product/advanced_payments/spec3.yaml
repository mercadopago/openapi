paths:
  /v1/advanced_payments:
    post:
      operationId: createAdvancedPayment
      summary: Create an advanced payment
      description: |-
        Creates a Wallet Connect advanced payment (marketplace split payment).

        **Available in:** Argentina, Brazil, Mexico (MLA, MLB, MLM)
      tags:
        - Wallet Connect
      parameters:
        - name: X-Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Meli-Session-Id
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                wallet_payment:
                  type: object
                  properties:
                    transaction_amount:
                      type: number
                      format: float
                    description:
                      type: string
                    external_reference:
                      type: string
                    statement_descriptor:
                      type: string
                payer:
                  type: object
                  properties:
                    token:
                      type: string
                    type_token:
                      type: string
                binary_mode:
                  type: boolean
                capture:
                  type: boolean
      responses:
        '201':
          description: Advanced payment created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  payments:
                    type: array
                    items:
                      type: object
                  wallet_payment:
                    type: object
                    properties:
                      transaction_amount:
                        type: number
                        format: float
                      description:
                        type: string
                      external_reference:
                        type: string
                  disbursements:
                    type: array
                    items:
                      type: object
                  payer:
                    type: object
                    properties:
                      token:
                        type: string
                      type_token:
                        type: string
                  site_id:
                    type: string
                  binary_mode:
                    type: boolean
                  date_created:
                    type: string
                    format: date-time
                  date_last_updated:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Internal server error
  /v1/advanced_payments/{advanced_payment_id}:
    get:
      operationId: getAdvancedPayment
      summary: Get an advanced payment
      description: '**Available in:** Argentina, Brazil, Mexico (MLA, MLB, MLM)'
      tags:
        - Wallet Connect
      parameters:
        - name: advanced_payment_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Advanced payment found
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  payments:
                    type: array
                    items:
                      type: object
                  wallet_payment:
                    type: object
                    properties:
                      transaction_amount:
                        type: number
                        format: float
                      description:
                        type: string
                      external_reference:
                        type: string
                  disbursements:
                    type: array
                    items:
                      type: object
                  payer:
                    type: object
                    properties:
                      token:
                        type: string
                      type_token:
                        type: string
                  site_id:
                    type: string
                  binary_mode:
                    type: boolean
                  date_created:
                    type: string
                    format: date-time
                  date_last_updated:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: Internal server error
    put:
      operationId: updateAdvancedPayment
      summary: Capture or cancel an advanced payment
      description: |-
        Capture (capture=true) or cancel (status=cancelled).

        **Available in:** Argentina, Brazil, Mexico (MLA, MLB, MLM)
      tags:
        - Wallet Connect
      parameters:
        - name: advanced_payment_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                capture:
                  type: boolean
                status:
                  type: string
                  enum:
                    - cancelled
                wallet_payment:
                  type: object
                  properties:
                    transaction_amount:
                      type: number
                      format: float
                    description:
                      type: string
                    external_reference:
                      type: string
      responses:
        '200':
          description: Advanced payment updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  payments:
                    type: array
                    items:
                      type: object
                  wallet_payment:
                    type: object
                    properties:
                      transaction_amount:
                        type: number
                        format: float
                      description:
                        type: string
                      external_reference:
                        type: string
                  disbursements:
                    type: array
                    items:
                      type: object
                  payer:
                    type: object
                    properties:
                      token:
                        type: string
                      type_token:
                        type: string
                  site_id:
                    type: string
                  binary_mode:
                    type: boolean
                  date_created:
                    type: string
                    format: date-time
                  date_last_updated:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: Internal server error
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Access token. Send in Authorization header only — never as a URL query parameter.
    publicKey:
      type: apiKey
      in: header
      name: X-Public-Key
      description: Public key for client-side card tokenization via MercadoPago.js only. Never use for server-side calls.
    mercadopagoOAuth:
      type: oauth2
      description: OAuth 2.0 authorization_code flow for marketplace on-behalf-of and Wallet Connect integrations. For client_credentials and refresh_token, use POST /oauth/token directly with the appropriate grant_type.
      flows:
        authorizationCode:
          authorizationUrl: https://auth.mercadopago.com/authorization
          tokenUrl: https://api.mercadopago.com/oauth/token
          scopes:
            read: Read access to account data
            write: Write access (create payments, orders)
            offline_access: Issue refresh tokens for long-lived access
  responses:
    BadRequest:
      description: Bad request — validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: Business rule violation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Rate limit exceeded — wait before retrying
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying this request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 429
            error: too_many_requests
            message: Rate limit exceeded. Retry after the indicated number of seconds.
  schemas: {}
