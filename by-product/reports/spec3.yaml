paths:
  /v1/account/settlement_report/config:
    post:
      operationId: createSettlementReportConfig
      summary: Create settlements report configuration
      description: Creates the configuration for automatic all-transactions (settlements) report generation. Defines columns, schedule frequency, file format, and optional SFTP delivery.
      tags:
        - Settlements Report
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportConfig'
      responses:
        '200':
          description: Configuration created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportConfig'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      operationId: updateSettlementReportConfig
      summary: Update settlements report configuration
      tags:
        - Settlements Report
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportConfig'
      responses:
        '200':
          description: Configuration updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportConfig'
    get:
      operationId: getSettlementReportConfig
      summary: Get settlements report configuration
      tags:
        - Settlements Report
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportConfig'
  /v1/account/settlement_report:
    post:
      operationId: createSettlementReport
      summary: Create a settlements report
      description: Generates a one-time all-transactions report for the specified date range. Returns a task ID to poll for completion.
      tags:
        - Settlements Report
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
      responses:
        '202':
          description: Report generation started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportTask'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    get:
      operationId: getSettlementReport
      summary: Get settlements report list
      tags:
        - Settlements Report
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Report list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportListResult'
  /v1/account/settlement_report/search:
    get:
      operationId: searchSettlementReports
      summary: Search settlements reports
      tags:
        - Settlements Report
      security:
        - bearerAuth: []
      parameters:
        - name: begin_date
          in: query
          schema:
            type: string
            format: date-time
        - name: end_date
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Matching reports
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportListResult'
  /v1/account/settlement_report/task/{task_id}:
    get:
      operationId: getSettlementReportTask
      summary: Get settlements report task status
      tags:
        - Settlements Report
      security:
        - bearerAuth: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportTask'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/account/settlement_report/schedule:
    post:
      operationId: enableSettlementReportSchedule
      summary: Enable automatic settlements report generation
      tags:
        - Settlements Report
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Schedule enabled
    delete:
      operationId: disableSettlementReportSchedule
      summary: Disable automatic settlements report generation
      tags:
        - Settlements Report
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Schedule disabled
  /v1/account/settlement_report/list:
    get:
      operationId: listScheduledSettlementReports
      summary: List scheduled settlements reports
      tags:
        - Settlements Report
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Scheduled report list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportListResult'
  /v1/account/settlement_report/{file_name}:
    get:
      operationId: downloadSettlementReport
      summary: Download a settlements report file
      tags:
        - Settlements Report
      security:
        - bearerAuth: []
      parameters:
        - name: file_name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Report file
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Access token. Send in Authorization header only — never as a URL query parameter.
    publicKey:
      type: apiKey
      in: header
      name: X-Public-Key
      description: Public key for client-side card tokenization via MercadoPago.js only. Never use for server-side calls.
    mercadopagoOAuth:
      type: oauth2
      description: OAuth 2.0 authorization_code flow for marketplace on-behalf-of and Wallet Connect integrations. For client_credentials and refresh_token, use POST /oauth/token directly with the appropriate grant_type.
      flows:
        authorizationCode:
          authorizationUrl: https://auth.mercadopago.com/authorization
          tokenUrl: https://api.mercadopago.com/oauth/token
          scopes:
            read: Read access to account data
            write: Write access (create payments, orders)
            offline_access: Issue refresh tokens for long-lived access
  responses:
    BadRequest:
      description: Bad request — validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: Business rule violation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Rate limit exceeded — wait before retrying
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying this request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: 429
            error: too_many_requests
            message: Rate limit exceeded. Retry after the indicated number of seconds.
  schemas:
    Pagination:
      type: object
      description: Pagination metadata returned in list/search responses
      properties:
        total:
          type: integer
          description: Total number of results
          example: 42
        limit:
          type: integer
          description: Results per page
          example: 30
        offset:
          type: integer
          description: Offset of the current page
          example: 0
    ReportConfig:
      type: object
      description: Configuration for scheduled report generation
      properties:
        columns:
          type: array
          description: Columns to include in the report
          items:
            type: object
            properties:
              key:
                type: string
                example: DATE
              alias:
                type: string
                example: transaction_date
        file_name_prefix:
          type: string
          description: Prefix for generated report filenames
          example: releases_report
        frequency:
          type: object
          description: Schedule frequency for automatic generation
          properties:
            hour:
              type: integer
              minimum: 0
              maximum: 23
            type:
              type: string
              enum:
                - daily
                - weekly
                - monthly
        sftp_info:
          type: object
          description: SFTP destination for automatic delivery (optional)
          properties:
            server:
              type: string
            port:
              type: integer
            username:
              type: string
            remote_dir:
              type: string
        separator:
          type: string
          description: CSV column separator character
          enum:
            - ','
            - ;
            - ''
          default: ','
        display_timezone:
          type: string
          description: Timezone for date columns (IANA format)
          example: America/Sao_Paulo
        notification_email_list:
          type: array
          description: Email addresses to notify when report is ready
          items:
            type: string
            format: email
    ReportRequest:
      type: object
      required:
        - begin_date
        - end_date
      description: Request body to generate a one-time report
      properties:
        begin_date:
          type: string
          format: date-time
          description: Start of the reporting period (ISO 8601)
          example: '2024-01-01T00:00:00Z'
        end_date:
          type: string
          format: date-time
          description: End of the reporting period (ISO 8601)
          example: '2024-01-31T23:59:59Z'
    ReportTask:
      type: object
      description: Status of a report generation task
      properties:
        id:
          type: string
          description: Task unique identifier
          example: task_abc123
        status:
          type: string
          enum:
            - pending
            - in_progress
            - done
            - failed
          description: pending — queued; in_progress — generating; done — ready to download; failed — generation error
        begin_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        download_url:
          type: string
          format: uri
          description: Download URL (present when status=done)
          nullable: true
    ReportEntry:
      type: object
      description: A generated report file entry
      properties:
        id:
          type: string
        status:
          type: string
          enum:
            - available
            - expired
        date_created:
          type: string
          format: date-time
        date_last_updated:
          type: string
          format: date-time
        begin_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        file_name:
          type: string
          example: releases_report_2024-01-01_2024-01-31.csv
    ReportListResult:
      type: object
      properties:
        paging:
          $ref: '#/components/schemas/Pagination'
        results:
          type: array
          items:
            $ref: '#/components/schemas/ReportEntry'
